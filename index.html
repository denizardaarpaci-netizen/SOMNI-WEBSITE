const parse=buf=>{const dv=new DataView(buf),n=buf.byteLength>84?dv.getUint32(80,true):0,pos=[];if(n&&84+n*50===buf.byteLength){for(let i=0;i<n;i++){const o=84+i*50+12;for(let k=0;k<9;k++)pos.push(dv.getFloat32(o+k*4,true))}}else{const s=new TextDecoder().decode(buf),re=/vertex\s+(\S+)\s+(\S+)\s+(\S+)/g;let m;while((m=re.exec(s)))pos.push(+m[1],+m[2],+m[3])}return new Float32Array(pos)};
const load=buf=>{const p=parse(buf);if(!p.length)throw 0;while(grp.children.length)grp.remove(grp.children[0]);const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(p,3));g.computeVertexNormals();g.center();g.computeBoundingSphere();const m=new T.Mesh(g,new T.MeshStandardMaterial({color:0xB59451,metalness:.6,roughness:.35,side:T.DoubleSide}));m.rotation.x=-Math.PI/2;grp.add(m);dist=g.boundingSphere.radius*3.2;auto=!rm};

const STORY={"hardware": {"t": "Hardware", "s": [{"h": "The learning curve for sensors", "b": [{"p": "In turkey after spending time learning the basics using arduino nanos and other basic sensors and components i bought a arduino nano a bluetooth chip and the max30102 sensor to understand simply how the sensor acts behaves and how to control the sensor in the Arduino IDE as well as the Bluetooth connectivity"}, {"i": ["x8", "x10", "x11"]}, {"p": "I got the sensor working and successfully had it give me some data back but the data was incredibly incorrect my heartrate was either 160 or 40 BPM and i could not derive the blood oxygen level. I also couldnt connect the bluetooth to the sensor and could only use the bluetooth to send messages to my phone from the computer wirelessly. I was frustrated so i decided to buy some ESP32 s in my trip to the US to learn microchips even better by experimenting and coursera."}, {"i": ["x12"]}]}, {"h": "Getting the components", "b": [{"p": "After understanding the workings of the ESP32 chips i bought the 3 axis accelerometer and the ESP32C6 to start building the project with real components i would use"}, {"i": ["x16"]}, {"i": ["x17"]}, {"p": "Understanding the complexity of the connections i decided to simulate the project through WOKWI first and had to create the MAX30102 sensor my self on the software as it was not already in the library allowing me to learn it very very well. It was a very nice inconvenience although frustrating at the time."}, {"i": ["x20"]}, {"p": "Confirming the connections i realised the problem was the breadbords unreliable connectivity so i had to improvise the wiring"}, {"i": ["x22"]}, {"p": "After weeks of trying and failing finally the sensor worked with the real ESP32C6 chip!"}, {"i": ["x21"]}, {"p": "I got the oxygen and heart beat outputs successfully after editing my code resleslly using AI and my own knowledge"}, {"i": ["x25"]}, {"p": "The problem was the background noise, the heart rate was fine not great but the oxygen levels were way off so i had to discuss the formulas i used in my codes with my maths teacher and the waves properties with my physics for a long time implementing Lagrange to get teh best outputs for my sensor but it worked"}]}, {"h": "The ACCELEROMETER", "b": [{"i": ["x28"]}, {"p": "After long months of optimizing yes months! The Heart rate sensor was what i like to call close to perfect, the data was not perfect as i had no health data but when i used the AI that i put in my app the values estimated were almost identical to my Apple watch and close to my dads Garmin. I felt like the hard part was over now it was time to connect the accelerometer."}, {"i": ["x29"]}, {"p": "The experience and courses, conversations and the burned sensors proved the importance of power outputs to me so this time i was committed to only having to buy one accelerometer (Spoiler i was delusional) I measured the voltage constantly and connected the accelerometer starting to write my code."}, {"p": "I fried one accelerometer sensor adn had to buy a new one but i was close to success so some more experimenting with simulators finally landed me success"}, {"i": ["x33"]}, {"p": "There it was the accelerometer was working perfectly and although it was off a bit with its reading at first some simple tweaking and ChatGPT tips helped me make it work flawlessly"}, {"p": "Now there was one left the temperature sensor."}, {"i": ["x32"]}]}, {"h": "The temperature sensor", "b": [{"p": "Not knowing how wearable companies use temperature sensors i bought a normal one a TMP 36 a small black sensor with three legs."}, {"i": ["x36"]}, {"p": "I got tempature readings it was great i thought the code was super simple only took a weekend but the reading again were of the charts the reading were consistently minus degrees. I am in my room though ?"}, {"p": "While trying to fix the code i did it again. Suddenly the sensor started burning LITTERALLY. There was smoke coming out of my breadboard i immediately plugged it out and when i tried my old code the sensor was fried. Three sensors fried up until now made me feel like i didnt now what was going on at all but this was not so bad."}, {"p": "While researching i realised companies that do wearables use thermistors to measure temperature to keep size small so i ordered a 10K NTC thermistor and when it arrived i was lost again."}, {"p": "After watching coubntless vidoes i had many questions so i went to my physics teacher to ask her every question i had in converting this thermistor to a temperature sensor and after a few long conversations after school i understood the equations. The coding was very simple otherwise. It was simply like a resistor."}]}, {"h": "CONNECTING THE SENSORS INTO ONE.", "b": [{"p": "I checked the accelerometer one last time and started the big one. Connecting the code for all the sensors into one big chunk to download to the chip."}, {"p": "First try was a fail but i was used to it now days spent on connecting the accelerometer and heart rate sensor together were spent they were the hard part the temperature was just the cherry on top."}, {"i": ["x39"]}, {"p": "And it was a success finally, every 20 second i got the oxygen level the movement level and the BPM the holy trinity i needed to feed the AI to get a variety of data while the accelerometer read every second twice to be precise as possible in the sleep calculations"}, {"i": ["x42"]}]}, {"h": "CONNECTING EVERYTHING", "b": [{"p": "Making the app was another journey which you can see in the other tab however when i got the tab done it was time for the big reveal I needed to connect everything so i cracked up Android Studio got my old Huawei phone and installed the app"}, {"p": "I changed the required setting and connected the device via bluetooth now it was time to open the app and see if i would get a reading"}, {"i": ["x45"]}, {"p": "I entered my credentials and opened it up with the sensor on my finger"}, {"i": ["x48", "x49", "x50", "x51"]}, {"p": "Were the readings perfect no but the information was going through the sensor to the app. My friend holding the camera and my hadn tied to a breadboard i couldnt stay like this for days so i decided to manufacture past data and upload it to see of the calendar and other components were working"}, {"i": ["x54", "x55", "x56"]}, {"p": "This was a feeling i cannot express, over a year almost two into electronics and here i was with a fully working system right from my mind to my hand. The only thing left was to make the wiry mess into a small case."}]}]}, "soldering": {"t": "Soldering and Designing", "s": [{"h": "", "b": [{"p": "I had some information on SolidWorks and Fusion from my internships but i had to pair it with days of courses to create so while learning that part i decided to start soldering."}, {"p": "Its easy to say teh learning curve was though, the first solders weer honestly just pure melted plastic but practice over practice with my old burned sensors and older chips, wires got me confident to finally solder the real thing for my FIRST PROTOTYPE."}, {"i": ["x59"]}, {"i": ["x62"]}, {"p": "Ugly yes however functional well first it was a no. I set the temperature of my solder too high burning every singlet thing i soldered but second try was a success. I connected it and worked perfectly like the breadboard. The heart rate sensor is on the other side as it needs to touch skin but you can see the horrendous pins poking from the middle."}]}, {"h": "THE PCB", "b": [{"p": "The PCB design was by far the hardest part and its still ot fully complete but on its way."}, {"i": ["x65"]}, {"i": ["x66"]}, {"i": ["x67"]}, {"p": "I mean its very wrong but i atleast have a understanding of KiCad now so further work will definitely allow me to make a very compact and nice PCB in the next month or so."}]}]}, "theapp": {"t": "Creating the App", "s": [{"h": "", "b": [{"p": "I first learned VScode and C++ on my one to start and took months to get to being able to get prototypes."}, {"i": ["a6"]}, {"p": "I first had to completely get the VSCode interface down"}, {"i": ["a8"]}, {"p": "Next was getting the AI API key down which was quite easy but the hardest part was still waiting."}, {"i": ["a9"]}, {"p": "Weeks after weeks spent on coding the app creating different prototypes and many failures."}, {"i": ["a12"]}, {"p": "I finally got the first working prototype down"}, {"i": ["a13"]}, {"p": "Yes it was very very ugly and honeslty seemed sad but it was a great achievement, to finally se the AI bot working."}, {"i": ["a16", "a17"]}, {"p": "Then came better and better prototypes each time until after months of coding beside the hardware developing i created the final version"}, {"i": ["a20", "a22", "a21", "a23"]}, {"p": "The data yet wasnt correct and i had to simulate it however it worked perfectly with many different pages and every detail in place however it wasn't easy."}, {"i": ["a26"]}, {"p": "I failed a thousand times coming to the final version but it was definitely worth it to see it working go to the end of HARDWARE section."}]}]}, "case": {"t": "The Case Design", "s": [{"h": "", "b": [{"p": "It started as a simple idea in ThinkerCad however with time that drawing evolved"}, {"i": ["a34"]}, {"p": "Using my existing knowledge from internships and a ton of videos i got comfortable enough with fusion to design it perfectly to my components sizes."}, {"i": ["a29"]}, {"i": ["a30"]}, {"i": ["a31"]}, {"p": "With fusion i created the perfect case so that people that want to build the project easily can do so."}]}]}};
