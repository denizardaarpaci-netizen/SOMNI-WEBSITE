const STORY={"hardware": {"t": "Hardware", "s": [{"h": "The learning curve for sensors", "b": [{"p": "I learned C++, Arduino IDE and PCB design in my internship at Kubey Tech, and I learned Fusion in my internship at Mitas Civata."}, {"p": "In Turkey, after spending time learning the basics using Arduino Nanos and other basic sensors and components, I bought an Arduino Nano, a Bluetooth chip and the MAX30102 sensor to understand simply how the sensor acts and behaves and how to control the sensor in the Arduino IDE, as well as the Bluetooth connectivity."}, {"i": ["x8", "x10", "x11"]}, {"p": "I got the sensor working and successfully had it give me some data back, but the data was incredibly incorrect. My heart rate was either 160 or 40 BPM and I could not derive the blood oxygen level. I also couldn’t connect the Bluetooth to the sensor and could only use the Bluetooth to send messages to my phone from the computer wirelessly. I was frustrated, so I decided to buy some ESP32s on my trip to the US to learn microchips even better by experimenting and Coursera."}, {"i": ["x12"]}]}, {"h": "Getting the components", "b": [{"p": "After understanding the workings of the ESP32 chips, I bought the 3 axis accelerometer and the ESP32C6 to start building the project with real components I would use."}, {"i": ["x16"]}, {"i": ["x17"]}, {"p": "Understanding the complexity of the connections, I decided to simulate the project through WOKWI first and had to create the MAX30102 sensor myself on the software, as it was not already in the library, allowing me to learn it very, very well. It was a very nice inconvenience, although frustrating at the time."}, {"i": ["x20"]}, {"p": "Confirming the connections, I realised the problem was the breadboard’s unreliable connectivity, so I had to improvise the wiring."}, {"i": ["x22"]}, {"p": "After weeks of trying and failing, finally the sensor worked with the real ESP32C6 chip!"}, {"i": ["x21"]}, {"p": "I got the oxygen and heartbeat outputs successfully after editing my code restlessly, using AI and my own knowledge."}, {"i": ["x25"]}, {"p": "The problem was the background noise; the heart rate was fine, not great, but the oxygen levels were way off, so I had to discuss the formulas I used in my code with my maths teacher and the wave properties with my physics teacher for a long time, implementing Lagrange to get the best outputs for my sensor, but it worked."}]}, {"h": "The ACCELEROMETER", "b": [{"i": ["x28"]}, {"p": "After long months of optimizing (yes, months!), the heart rate sensor was what I like to call close to perfect. The data was not perfect, as I had no health data, but when I used the AI that I put in my app, the values estimated were almost identical to my Apple Watch and close to my dad’s Garmin. I felt like the hard part was over; now it was time to connect the accelerometer."}, {"i": ["x29"]}, {"p": "The experience and courses, conversations and the burned sensors proved the importance of power outputs to me, so this time I was committed to only having to buy one accelerometer (spoiler: I was delusional). I measured the voltage constantly and connected the accelerometer, starting to write my code."}, {"p": "I fried one accelerometer sensor and had to buy a new one, but I was close to success, so some more experimenting with simulators finally landed me success."}, {"i": ["x33"]}, {"p": "There it was: the accelerometer was working perfectly, and although it was off a bit with its reading at first, some simple tweaking and ChatGPT tips helped me make it work flawlessly."}, {"p": "Now there was one left, the temperature sensor."}, {"i": ["x32"]}]}, {"h": "The temperature sensor", "b": [{"p": "Not knowing how wearable companies use temperature sensors, I bought a normal one, a TMP36, a small black sensor with three legs."}, {"i": ["x36"]}, {"p": "I got temperature readings, it was great, I thought. The code was super simple, only took a weekend, but the readings again were off the charts. The readings were consistently minus degrees. I am in my room, though?"}, {"p": "While trying to fix the code, I did it again. Suddenly the sensor started burning, LITERALLY. There was smoke coming out of my breadboard. I immediately unplugged it, and when I tried my old code, the sensor was fried. Three sensors fried up until now made me feel like I didn’t know what was going on at all, but this was not so bad."}, {"p": "While researching, I realised companies that do wearables use thermistors to measure temperature to keep size small, so I ordered a 10K NTC thermistor, and when it arrived I was lost again."}, {"p": "After watching countless videos, I had many questions, so I went to my physics teacher to ask her every question I had in converting this thermistor to a temperature sensor, and after a few long conversations after school, I understood the equations. The coding was very simple otherwise. It was simply like a resistor."}]}, {"h": "CONNECTING THE SENSORS INTO ONE.", "b": [{"p": "I checked the accelerometer one last time and started the big one: connecting the code for all the sensors into one big chunk to download to the chip."}, {"p": "First try was a fail, but I was used to it now. Days were spent on connecting the accelerometer and heart rate sensor together; they were the hard part, and the temperature was just the cherry on top."}, {"i": ["x39"]}, {"p": "And it was a success finally! Every 20 seconds I got the oxygen level, the movement level and the BPM, the holy trinity I needed to feed the AI to get a variety of data, while the accelerometer read every second twice to be as precise as possible in the sleep calculations."}, {"i": ["x42"]}]}, {"h": "CONNECTING EVERYTHING", "b": [{"p": "Making the app was another journey, which you can see in the other tab. However, when I got the tab done, it was time for the big reveal. I needed to connect everything, so I cracked open Android Studio, got my old Huawei phone and installed the app."}, {"p": "I changed the required setting and connected the device via Bluetooth. Now it was time to open the app and see if I would get a reading."}, {"i": ["x45"]}, {"p": "I entered my credentials and opened it up with the sensor on my finger."}, {"i": ["x48", "x49", "x50", "x51"]}, {"p": "Were the readings perfect? No, but the information was going through the sensor to the app. My friend was holding the camera and my hand was tied to a breadboard; I couldn’t stay like this for days, so I decided to manufacture past data and upload it to see if the calendar and other components were working."}, {"i": ["x54", "x55", "x56"]}, {"p": "This was a feeling I cannot express: over a year, almost two, into electronics, and here I was with a fully working system, right from my mind to my hand. The only thing left was to make the wiry mess into a small case."}]}]}, "soldering": {"t": "Soldering and Designing", "s": [{"h": "", "b": [{"p": "I had some information on SolidWorks and Fusion from my internships, but I had to pair it with days of courses to create, so while learning that part, I decided to start soldering."}, {"p": "It’s easy to say the learning curve was tough; the first solders were honestly just pure melted plastic, but practice over practice with my old burned sensors, older chips and wires got me confident to finally solder the real thing for my FIRST PROTOTYPE."}, {"i": ["x59"]}, {"i": ["x62"]}, {"p": "Ugly, yes. However, functional? Well, first it was a no. I set the temperature of my solder too high, burning every single thing I soldered, but the second try was a success. I connected it and it worked perfectly, like the breadboard. The heart rate sensor is on the other side as it needs to touch skin, but you can see the horrendous pins poking from the middle."}, {"i": ["p1done"]}, {"p": "And here it is, the finished first prototype: the XIAO ESP32-C6, a 250 mAh battery and the sensors on a perfboard, sitting inside my 3D-printed case. After the burned first attempt, this one worked seamlessly."}]}, {"h": "THE PCB", "b": [{"p": "The PCB design was by far the hardest part, and it’s still not fully complete, but it’s on its way."}, {"i": ["x65"]}, {"i": ["x66"]}, {"i": ["x67"]}, {"p": "I mean, it’s very wrong, but I at least have an understanding of KiCad now, so further work will definitely allow me to make a very compact and nice PCB in the next month or so."}]}, {"h": "THE SECOND PROTOTYPE", "b": [{"p": "The second prototype is the one that took ages to craft. Where the first prototype is a case full of wires and a perfboard, this one is a round PCB that is now only the size of a coin, 28 mm in diameter."}, {"i": ["p2pcb"]}, {"p": "On the left is the top side, with the main chip and its antenna area. On the right is the underside, mirrored, which is the side that touches the skin: it carries the MAX30102 heart-rate sensor and the pogo pins."}, {"p": "It is just a prototype, though. It is not complete yet, and I am still working on it."}]}]}, "theapp": {"t": "Creating the App", "s": [{"h": "", "b": [{"p": "I learned C++, Arduino IDE and PCB design in my internship at Kubey Tech, and I learned Fusion in my internship at Mitas Civata."}, {"p": "I first learned VSCode and C++ on my own to start, and it took months to get to being able to get prototypes."}, {"i": ["a6"]}, {"p": "I first had to completely get the VSCode interface down."}, {"i": ["a8"]}, {"p": "Next was getting the AI API key down, which was quite easy, but the hardest part was still waiting."}, {"i": ["a9"]}, {"p": "Weeks after weeks spent on coding the app, creating different prototypes and many failures."}, {"i": ["a12"]}, {"p": "I finally got the first working prototype down."}, {"i": ["a13"]}, {"p": "Yes, it was very, very ugly and honestly seemed sad, but it was a great achievement to finally see the AI bot working."}, {"i": ["a16", "a17"]}, {"p": "Then came better and better prototypes each time, until after months of coding beside the hardware developing, I created the final version."}, {"i": ["a20", "a22", "a21", "a23"]}, {"p": "The data wasn’t correct yet and I had to simulate it; however, it worked perfectly with many different pages and every detail in place. However, it wasn’t easy."}, {"i": ["a26"]}, {"p": "I failed a thousand times coming to the final version, but it was definitely worth it to see it working. Go to the end of the HARDWARE section."}]}]}, "case": {"t": "The Case Design", "s": [{"h": "", "b": [{"p": "It started as a simple idea in Tinkercad; however, with time that drawing evolved."}, {"i": ["a34"]}, {"p": "Using my existing knowledge from internships and a ton of videos, I got comfortable enough with Fusion to design it perfectly to my components’ sizes."}, {"i": ["a29"]}, {"i": ["a30"]}, {"i": ["a31"]}, {"p": "With Fusion I created the perfect case so that people who want to build the project can easily do so."}]}]}};
